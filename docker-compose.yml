version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: chatty_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks: [chatty_net]

  redis:
    image: redis:7
    container_name: chatty_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks: [chatty_net]

  redisinsight:
    image: redis/redisinsight:latest
    container_name: chatty_redis_ui
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      - redis
    networks: [chatty_net]

networks:
  chatty_net:

volumes:
  mongo_data:
  redis_data:
  redisinsight_data:
